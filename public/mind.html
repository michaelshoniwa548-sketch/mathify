<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trillion Mind — Living 3D Neural Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/mind/mind.css">

    <!-- ES Module Import Map for Three.js r0.174 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.174.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="mind-container">
        <!-- 3D Canvas -->
        <canvas id="mind-canvas"></canvas>

        <!-- UI Overlay Header & Stats -->
        <div id="mind-overlay">
            <header class="mind-header">
                <div class="brand">
                    <span class="mind-pulse-icon"></span>
                    <h1>Trillion <span>Mind Map</span></h1>
                </div>
                <div class="stats-bar" id="stats-bar">
                    Loading Mind Topology...
                </div>
            </header>

            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" id="mind-search" placeholder="Search mind memories, tools, files... (Press Enter)" autocomplete="off">
            </div>

            <!-- Region Toggles Legend -->
            <div class="legend-panel" id="legend-panel">
                <!-- Dynamically generated region toggle chips -->
            </div>

            <!-- Hover Tooltip -->
            <div id="mind-tooltip" class="mind-tooltip hidden"></div>

            <!-- Side Inspector Panel -->
            <div id="mind-inspector" class="mind-inspector hidden">
                <button class="close-btn" id="inspector-close">&times;</button>
                <div class="inspector-content" id="inspector-content">
                    <p class="placeholder-text">Select a node to inspect details...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Module Entry Point -->
    <script type="module" src="/mind/scene.js"></script>
</body>
</html>
